<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marovia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="scene">

        <!-- Canopy -->
        <div class="canopy canopy-left"></div>
        <div class="canopy canopy-right"></div>

        <!-- Hero -->
        <header class="hero">
            <h1 class="title">Marovia</h1>

            <button class="play-btn" id="playBtn">
                <span>Play</span>
            </button>
        </header>

        <!-- Wooden panel -->
        <main class="panel">
            <div class="pillar pillar-left" aria-hidden="true"></div>
            <div class="pillar pillar-right" aria-hidden="true"></div>

            <div class="panel-inner">
                <h2 class="panel-heading">Choose Your Game</h2>

                <section class="game-section">
                    <h3 class="section-label"><span></span>Traditional Games<span></span></h3>
                    <div class="tile-grid">
                        <button class="tile" data-game="aada-puli-attam">Aada Puli<br>Atttam</button>
                        <button class="tile" data-game="thayyam">Thayyam</button>
                        <button class="tile" data-game="kallangai">Kallangai</button>
                        <button class="tile" data-game="pantharom">Pantharom</button>
                        <button class="tile" data-game="nondi">Nondi</button>
                    </div>
                </section>

                <div class="mandala-divider">
                    <span class="diya" aria-hidden="true">🪔</span>
                    <svg class="mandala" viewBox="0 0 200 200" aria-hidden="true">
                        <g fill="none" stroke="currentColor" stroke-width="1">
                            <circle cx="100" cy="100" r="20" />
                            <circle cx="100" cy="100" r="45" />
                            <circle cx="100" cy="100" r="70" />
                            <g id="petals"></g>
                        </g>
                    </svg>
                    <span class="diya" aria-hidden="true">🪔</span>
                </div>

                <section class="game-section">
                    <h3 class="section-label"><span></span>Local Games<span></span></h3>
                    <div class="tile-grid">
                        <button class="tile" data-game="pambaram">Pambaram</button>
                        <button class="tile" data-game="uduyall">Uduyall</button>
                        <button class="tile" data-game="gilli">Gilli</button>
                        <button class="tile" data-game="pittu-kuthirai">Pittu Kuthirai</button>
                        <button class="tile" data-game="sallor-gundu">Sallor Gundu</button>
                    </div>
                </section>

                <footer class="panel-footer">
                    <span class="diya diya-small" aria-hidden="true">🪔</span>
                    <p>Welcome to Marovia</p>
                    <span class="diya diya-small" aria-hidden="true">🪔</span>
                </footer>
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>

</html>
